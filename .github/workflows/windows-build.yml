name: Windows PC Gradle Build & Compatibility

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  windows-build:
    name: Build & Verify on Windows PC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle & Run Unit Tests on Windows
        run: |
          if (Test-Path ".\gradlew.bat") {
            .\gradlew.bat testDebugUnitTest --stacktrace
          } else {
            gradle testDebugUnitTest --stacktrace
          }
        shell: powershell

      - name: Build Debug APK on Windows
        run: |
          if (Test-Path ".\gradlew.bat") {
            .\gradlew.bat assembleDebug --stacktrace
          } else {
            gradle assembleDebug --stacktrace
          }
        shell: powershell

      - name: Upload Windows Build APK
        uses: actions/upload-artifact@v4
        with:
          name: modhub-v1.1-windows-build-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
